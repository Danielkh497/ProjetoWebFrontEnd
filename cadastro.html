<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Tela de cadastro do sistema FutCampos.">

    <title>Cadastro - FutCampos</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/cadastro.css">

</head>

<body>

    <!-- FUNDO -->
    <div class="background"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="cadastro-container">

        <!-- CARD CADASTRO -->
        <form class="cadastro-box"
              action="login.html"
              method="get">

            <!-- LOGO -->
            <div class="logo-cadastro">

                <img src="icones/Logo.svg"
                     alt="Logo FutCampos">

                <h1>FutCampos</h1>

            </div>

            <!-- TÍTULO -->
            <h2>Cadastro</h2>

            <p>
                Crie sua conta para agendar horários.
            </p>

            <!-- NOME -->
            <div class="input-group">

                <label for="nome">
                    Nome Completo
                </label>

                <input type="text"
                       id="nome"
                       placeholder="Digite seu nome"
                       required>

            </div>

            <!-- EMAIL -->
            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input type="email"
                       id="email"
                       placeholder="Digite seu e-mail"
                       autocomplete="email"
                       required>

            </div>

            <!-- TELEFONE -->
            <div class="input-group">

                <label for="telefone">
                    Telefone
                </label>

                <input type="tel"
                       id="telefone"
                       placeholder="(00) 00000-0000"
                       required>

            </div>

            <!-- SENHA -->
            <div class="input-group">

                <label for="senha">
                    Senha
                </label>

                <input type="password"
                       id="senha"
                       placeholder="Digite sua senha"
                       required>

            </div>

            <!-- CONFIRMAR SENHA -->
            <div class="input-group">

                <label for="confirmar-senha">
                    Confirmar Senha
                </label>

                <input type="password"
                       id="confirmar-senha"
                       placeholder="Confirme sua senha"
                       required>

            </div>

            <!-- BOTÃO -->
            <button type="submit">
                Cadastrar
            </button>

            <!-- LOGIN -->
            <span class="login-link">

                Já possui conta?

                <a href="login.html">
                    Entrar
                </a>

            </span>

            <!-- VOLTAR -->
            <a href="index.html"
               class="voltar">

                Voltar para página inicial

            </a>

        </form>

    </main>

</body>

</html>
