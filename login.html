<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Tela de login do sistema FutCampos.">

    <title>Login - FutCampos</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

    <!-- FUNDO -->
    <div class="background"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="login-container">

        <!-- CARD LOGIN -->
        <form class="login-box"
              action="agendamento.html">

            <!-- LOGO -->
            <div class="logo-login">

                <img src="icones/Logo.svg"
                     alt="Logo FutCampos">

                <h1>FutCampos</h1>

            </div>

            <!-- TÍTULO -->
            <h2>Login</h2>

            <p>
                Entre para agendar seus horários.
            </p>

            <!-- EMAIL -->
            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input type="email"
                       id="email"
                       placeholder="Digite seu e-mail"
                       required>

            </div>

            <!-- SENHA -->
            <div class="input-group">

                <label for="senha">
                    Senha
                </label>

                <input type="password"
                       id="senha"
                       placeholder="Digite sua senha"
                       required>

            </div>

            <!-- BOTÃO -->
            <button type="submit">
                Entrar
            </button>

            <!-- CADASTRO -->
            <span class="cadastro-link">

                Não possui conta?

                <a href="cadastro.html">
                    Cadastre-se
                </a>

            </span>

            <!-- VOLTAR -->
            <a href="index.html"
               class="voltar">

                Voltar para página inicial

            </a>

        </form>

    </main>

</body>

</html>
